<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#075c3b">
<title>D e V Jardinagem</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#f3f6f4;
    color:#19352a;
    padding-bottom:80px;
}

header{
    background:#075c3b;
    color:white;
    padding:20px 18px;
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 8px #0003;
}

header h1{
    font-size:25px;
    margin-bottom:5px;
}

header p{
    font-size:13px;
    opacity:.9;
}

.container{
    max-width:800px;
    margin:auto;
    padding:16px;
}

.page{
    display:none;
}

.page.active{
    display:block;
}

h2{
    margin-bottom:15px;
}

.dashboard{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:12px;
}

.card{
    background:white;
    border-radius:16px;
    padding:18px;
    box-shadow:0 2px 8px #0001;
    margin-bottom:12px;
}

.card-title{
    font-size:13px;
    color:#65756e;
}

.number{
    font-size:27px;
    font-weight:bold;
    margin-top:7px;
}

.green{
    color:#075c3b;
}

.red{
    color:#c62828;
}

.blue{
    color:#1769aa;
}

button{
    border:none;
    border-radius:11px;
    padding:12px 15px;
    background:#075c3b;
    color:white;
    font-weight:bold;
    cursor:pointer;
    margin:3px;
}

button.secondary{
    background:#e2ebe6;
    color:#075c3b;
}

button.danger{
    background:#c62828;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    margin:12px 0;
}

.item{
    background:white;
    border-radius:14px;
    padding:15px;
    margin-bottom:10px;
    box-shadow:0 2px 6px #0001;
}

.item strong{
    font-size:17px;
}

.item small{
    display:block;
    color:#697871;
    margin-top:5px;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ccd7d1;
    border-radius:10px;
    margin-top:6px;
    margin-bottom:13px;
    font-size:16px;
    background:white;
}

textarea{
    min-height:90px;
    resize:vertical;
}

label{
    font-size:13px;
    font-weight:bold;
}

.form-row{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

.empty{
    text-align:center;
    color:#718078;
    padding:30px 10px;
}

.search{
    margin-bottom:12px;
}

.bottom-nav{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:white;
    border-top:1px solid #ddd;
    display:grid;
    grid-template-columns:repeat(5,1fr);
    padding:7px 3px;
    z-index:20;
}

.bottom-nav button{
    background:white;
    color:#50615a;
    padding:7px 2px;
    margin:0;
    font-size:11px;
}

.bottom-nav button.active{
    color:#075c3b;
    font-weight:bold;
}

.modal{
    display:none;
    position:fixed;
    inset:0;
    background:#0008;
    z-index:50;
    align-items:flex-end;
}

.modal.show{
    display:flex;
}

.modal-content{
    background:white;
    width:100%;
    max-height:92vh;
    overflow:auto;
    border-radius:22px 22px 0 0;
    padding:20px;
}

.modal-content h2{
    margin-bottom:20px;
}

.close{
    float:right;
    background:#eee;
    color:#333;
    border-radius:50%;
    width:38px;
    height:38px;
    padding:0;
}

.photo-box{
    border:2px dashed #b9c8c0;
    border-radius:12px;
    padding:20px;
    text-align:center;
    margin-bottom:12px;
}

.photo-preview{
    max-width:100%;
    border-radius:12px;
    margin-top:10px;
}

.badge{
    display:inline-block;
    padding:5px 9px;
    border-radius:20px;
    background:#e5f1eb;
    color:#075c3b;
    font-size:12px;
    font-weight:bold;
}

.finance-summary{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}

hr{
    border:none;
    border-top:1px solid #eee;
    margin:15px 0;
}

@media(max-width:500px){
    .form-row{
        grid-template-columns:1fr;
    }
}
</style>
</head>

<body>

<header>
    <h1>🌿 D e V JARDINAGEM</h1>
    <p>Controle completo de clientes, jardins, piscinas e financeiro</p>
</header>

<div class="container">

<!-- INÍCIO -->
<section id="inicio" class="page active">

<h2>🏠 Painel</h2>

<div class="dashboard">

<div class="card">
<div class="card-title">Clientes</div>
<div class="number" id="totalClientes">0</div>
</div>

<div class="card">
<div class="card-title">Piscinas</div>
<div class="number" id="totalPiscinas">0</div>
</div>

<div class="card">
<div class="card-title">Jardins</div>
<div class="number" id="totalJardins">0</div>
</div>

<div class="card">
<div class="card-title">Serviços</div>
<div class="number" id="totalServicos">0</div>
</div>

</div>

<div class="card">
<div class="card-title">Saldo atual</div>
<div class="number green" id="saldoInicio">R$ 0,00</div>
</div>

<div class="actions">
<button onclick="abrirModal('cliente')">+ Cliente</button>
<button onclick="abrirModal('servico')" class="secondary">+ Serviço</button>
<button onclick="abrirModal('financeiro')" class="secondary">+ Movimento</button>
</div>

<div class="card">
<h3>💰 Últimos movimentos</h3>
<div id="ultimosMovimentos"></div>
</div>

</section>


<!-- CLIENTES -->
<section id="clientes" class="page">

<h2>👥 Clientes</h2>

<input
class="search"
id="buscaCliente"
placeholder="🔎 Procurar cliente..."
oninput="mostrarClientes()">

<button onclick="abrirModal('cliente')">
+ Novo cliente
</button>

<div id="listaClientes"></div>

</section>


<!-- PISCINAS -->
<section id="piscinas" class="page">

<h2>🏊 Piscinas</h2>

<button onclick="abrirModal('piscina')">
+ Nova piscina
</button>

<div id="listaPiscinas"></div>

</section>


<!-- JARDINS -->
<section id="jardins" class="page">

<h2>🌿 Jardins</h2>

<button onclick="abrirModal('jardim')">
+ Novo jardim
</button>

<div id="listaJardins"></div>

</section>


<!-- FINANCEIRO -->
<section id="financeiro" class="page">

<h2>💰 Financeiro</h2>

<div class="finance-summary">

<div class="card">
<div class="card-title">Entradas</div>
<div class="number green" id="totalEntradas">R$ 0,00</div>
</div>

<div class="card">
<div class="card-title">Saídas</div>
<div class="number red" id="totalSaidas">R$ 0,00</div>
</div>

</div>

<div class="card">
<div class="card-title">Saldo</div>
<div class="number blue" id="saldoFinanceiro">R$ 0,00</div>
</div>

<button onclick="abrirModal('financeiro')">
+ Novo movimento
</button>

<hr>

<div id="listaFinanceiro"></div>

</section>


<!-- AGENDA -->
<section id="agenda" class="page">

<h2>📅 Agenda</h2>

<button onclick="abrirModal('servico')">
+ Agendar serviço
</button>

<div id="listaAgenda"></div>

</section>

</div>


<!-- NAVEGAÇÃO -->
<nav class="bottom-nav">

<button class="active" onclick="irPara('inicio',this)">
🏠<br>Início
</button>

<button onclick="irPara('clientes',this)">
👥<br>Clientes
</button>

<button onclick="irPara('piscinas',this)">
🏊<br>Piscinas
</button>

<button onclick="irPara('jardins',this)">
🌿<br>Jardins
</button>

<button onclick="irPara('financeiro',this)">
💰<br>Financeiro
</button>

</nav>


<!-- MODAL -->
<div id="modal" class="modal">

<div class="modal-content">

<button class="close" onclick="fecharModal()">×</button>

<h2 id="tituloModal"></h2>

<form id="formulario"></form>

</div>

</div>


<script>

const CHAVE = "dev_jardinagem_dados";

let dados = JSON.parse(
localStorage.getItem(CHAVE)
||
'{"clientes":[],"piscinas":[],"jardins":[],"financeiro":[],"servicos":[]}'
);

let tipoModal = "";

function salvar(){

localStorage.setItem(
CHAVE,
JSON.stringify(dados)
);

atualizarTudo();

}

function dinheiro(valor){

return Number(valor || 0).toLocaleString(
"pt-BR",
{
style:"currency",
currency:"BRL"
}
);

}

function escapar(texto){

return String(texto || "")
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}


function irPara(id,botao){

document.querySelectorAll(".page")
.forEach(p=>p.classList.remove("active"));

document.getElementById(id)
.classList.add("active");

document.querySelectorAll(".bottom-nav button")
.forEach(b=>b.classList.remove("active"));

botao.classList.add("active");

atualizarTudo();

window.scrollTo(0,0);

}


function abrirModal(tipo){

tipoModal=tipo;

let titulo="";
let html="";

if(tipo==="cliente"){

titulo="👤 Novo cliente";

html=`

<label>Nome</label>
<input name="nome" required>

<label>Telefone</label>
<input name="telefone" type="tel">

<label>Endereço</label>
<input name="endereco">

<label>Observações</label>
<textarea name="observacoes"></textarea>

<button type="submit">Salvar cliente</button>
`;

}


if(tipo==="piscina"){

titulo="🏊 Nova piscina";

html=`

<label>Cliente</label>
<select name="cliente">
${opcoesClientes()}
</select>

<label>Endereço</label>
<input name="endereco">

<div class="form-row">

<div>
<label>Volume / tamanho</label>
<input name="volume">
</div>

<div>
<label>pH</label>
<input name="ph" type="number" step="0.1">
</div>

</div>

<label>Cloro</label>
<input name="cloro">

<label>Produtos utilizados</label>
<textarea name="produtos"></textarea>

<label>Observações</label>
<textarea name="observacoes"></textarea>

<div class="photo-box">
📷 Foto da piscina
<input type="file" accept="image/*" name="foto">
</div>

<button type="submit">Salvar piscina</button>
`;

}


if(tipo==="jardim"){

titulo="🌿 Novo jardim";

html=`

<label>Cliente</label>
<select name="cliente">
${opcoesClientes()}
</select>

<label>Endereço</label>
<input name="endereco">

<label>Tipo de serviço</label>

<select name="servico">

<option>Poda e corte</option>
<option>Paisagismo</option>
<option>Horta</option>
<option>Manutenção geral</option>
<option>Plantio</option>
<option>Outro</option>

</select>

<label>Produtos utilizados</label>
<textarea name="produtos"></textarea>

<label>Observações</label>
<textarea name="observacoes"></textarea>

<div class="photo-box">
📷 Foto do jardim
<input type="file" accept="image/*" name="foto">
</div>

<button type="submit">Salvar jardim</button>
`;

}


if(tipo==="financeiro"){

titulo="💰 Movimento financeiro";

html=`

<label>Tipo</label>

<select name="tipo">

<option value="entrada">
💚 Entrada
</option>

<option value="saida">
🔴 Saída
</option>

</select>

<label>Descrição</label>
<input name="descricao" required>

<label>Categoria</label>

<select name="categoria">

<option>Serviço</option>
<option>Produto piscina</option>
<option>Terra</option>
<option>Adubo</option>
<option>Fertilizante</option>
<option>Gasolina</option>
<option>Manutenção de máquina</option>
<option>Ferramentas</option>
<option>Outros</option>

</select>

<label>Valor</label>
<input name="valor" type="number" step="0.01" required>

<label>Data</label>
<input name="data" type="date"
value="${new Date().toISOString().slice(0,10)}">

<button type="submit">
Salvar movimento
</button>
`;

}


if(tipo==="servico"){

titulo="📅 Agendar serviço";

html=`

<label>Tipo</label>

<select name="tipo">

<option>Piscina</option>
<option>Jardim</option>

</select>

<label>Cliente</label>

<select name="cliente">

${opcoesClientes()}

</select>

<label>Serviço</label>

<input name="servico" required>

<div class="form-row">

<div>

<label>Data</label>

<input
name="data"
type="date"
value="${new Date().toISOString().slice(0,10)}">

</div>

<div>

<label>Horário</label>

<input name="hora" type="time">

</div>

</div>

<label>Observações</label>

<textarea name="observacoes"></textarea>

<button type="submit">
Agendar serviço
</button>

`;

}


document.getElementById("tituloModal")
.innerHTML=titulo;

document.getElementById("formulario")
.innerHTML=html;

document.getElementById("modal")
.classList.add("show");

}


function fecharModal(){

document.getElementById("modal")
.classList.remove("show");

}


function opcoesClientes(){

if(dados.clientes.length===0){

return `<option value="">Nenhum cliente cadastrado</option>`;

}

return dados.clientes
.map(c=>`
<option value="${escapar(c.nome)}">
${escapar(c.nome)}
</option>
`)
.join("");

}


document.getElementById("formulario")
.addEventListener("submit",function(e){

e.preventDefault();

const formData=new FormData(this);

const objeto=Object.fromEntries(formData.entries());

objeto.id=Date.now();

if(tipoModal==="cliente"){

dados.clientes.push(objeto);

}

if(tipoModal==="piscina"){

dados.piscinas.push(objeto);

}

if(tipoModal==="jardim"){

dados.jardins.push(objeto);

}

if(tipoModal==="financeiro"){

objeto.valor=Number(objeto.valor);

dados.financeiro.push(objeto);

}

if(tipoModal==="servico"){

dados.servicos.push(objeto);

}

salvar();

fecharModal();

});


function mostrarClientes(){

const busca=
(document.getElementById("buscaCliente")?.value || "")
.toLowerCase();

const lista=dados.clientes.filter(c=>
c.nome.toLowerCase().includes(busca)
);

const elemento=
document.getElementById("listaClientes");

if(lista.length===0){

elemento.innerHTML=
'<div class="empty">Nenhum cliente encontrado.</div>';

return;

}

elemento.innerHTML=lista.map(c=>`

<div class="item">

<strong>👤 ${escapar(c.nome)}</strong>

<small>
📞 ${escapar(c.telefone)}
</small>

<small>
📍 ${escapar(c.endereco)}
</small>

<small>
${escapar(c.observacoes)}
</small>

</div>

`).join("");

}


function mostrarPiscinas(){

const el=document.getElementById("listaPiscinas");

if(dados.piscinas.length===0){

el.innerHTML=
'<div class="empty">Nenhuma piscina cadastrada.</div>';

return;

}

el.innerHTML=dados.piscinas.map(p=>`

<div class="item">

<strong>🏊 ${escapar(p.cliente)}</strong>

<span class="badge">
pH ${escapar(p.ph || "-")}
</span>

<span class="badge">
Cloro ${escapar(p.cloro || "-")}
</span>

<small>
📏 Volume/tamanho: ${escapar(p.volume)}
</small>

<small>
🧪 Produtos: ${escapar(p.produtos)}
</small>

<small>
📝 ${escapar(p.observacoes)}
</small>

</div>

`).join("");

}


function mostrarJardins(){

const el=document.getElementById("listaJardins");

if(dados.jardins.length===0){

el.innerHTML=
'<div class="empty">Nenhum jardim cadastrado.</div>';

return;

}

el.innerHTML=dados.jardins.map(j=>`

<div class="item">

<strong>🌿 ${escapar(j.cliente)}</strong>

<span class="badge">
${escapar(j.servico)}
</span>

<small>
📍 ${escapar(j.endereco)}
</small>

<small>
🌱 Produtos: ${escapar(j.produtos)}
</small>

<small>
📝 ${escapar(j.observacoes)}
</small>

</div>

`).join("");

}


function mostrarFinanceiro(){

let entradas=dados.financeiro
.filter(x=>x.tipo==="entrada")
.reduce((s,x)=>s+Number(x.valor),0);

let saidas=dados.financeiro
.filter(x=>x.tipo==="saida")
.reduce((s,x)=>s+Number(x.valor),0);

document.getElementById("totalEntradas")
.innerText=dinheiro(entradas);

document.getElementById("totalSaidas")
.innerText=dinheiro(saidas);

document.getElementById("saldoFinanceiro")
.innerText=dinheiro(entradas-saidas);

const el=document.getElementById("listaFinanceiro");

if(dados.financeiro.length===0){

el.innerHTML=
'<div class="empty">Nenhum movimento registrado.</div>';

return;

}

el.innerHTML=dados.financeiro
.slice()
.reverse()
.map(x=>`

<div class="item">

<strong class="${x.tipo==="entrada"?"green":"red"}">

${x.tipo==="entrada"?"🟢 +":"🔴 -"}
${dinheiro(x.valor)}

</strong>

<small>
${escapar(x.descricao)}
</small>

<small>
Categoria: ${escapar(x.categoria)}
</small>

<small>
Data: ${escapar(x.data)}
</small>

</div>

`)
.join("");

}


function mostrarAgenda(){

const el=document.getElementById("listaAgenda");

if(dados.servicos.length===0){

el.innerHTML=
'<div class="empty">Nenhum serviço agendado.</div>';

return;

}

const lista=dados.servicos
.slice()
.sort((a,b)=>
(a.data||"").localeCompare(b.data||"")
);

el.innerHTML=lista.map(s=>`

<div class="item">

<strong>
📅 ${escapar(s.data)}
</strong>

<span class="badge">
${escapar(s.hora || "Horário não informado")}
</span>

<small>
👤 ${escapar(s.cliente)}
</small>

<small>
${escapar(s.tipo)} — ${escapar(s.servico)}
</small>

<small>
${escapar(s.observacoes)}
</small>

</div>

`).join("");

}


function atualizarInicio(){

document.getElementById("totalClientes")
.innerText=dados.clientes.length;

document.getElementById("totalPiscinas")
.innerText=dados.piscinas.length;

document.getElementById("totalJardins")
.innerText=dados.jardins.length;

document.getElementById("totalServicos")
.innerText=dados.servicos.length;

let entradas=dados.financeiro
.filter(x=>x.tipo==="entrada")
.reduce((s,x)=>s+Number(x.valor),0);

let saidas=dados.financeiro
.filter(x=>x.tipo==="saida")
.reduce((s,x)=>s+Number(x.valor),0);

document.getElementById("saldoInicio")
.innerText=dinheiro(entradas-saidas);

const el=document.getElementById("ultimosMovimentos");

if(dados.financeiro.length===0){

el.innerHTML=
'<div class="empty">Nenhum movimento ainda.</div>';

return;

}

el.innerHTML=dados.financeiro
.slice()
.reverse()
.slice(0,5)
.map(x=>`

<div class="item">

<strong class="${x.tipo==="entrada"?"green":"red"}">

${x.tipo==="entrada"?"🟢":"🔴"}
${dinheiro(x.valor)}

</strong>

<small>
${escapar(x.descricao)}
</small>

</div>

`).join("");

}


function atualizarTudo(){

atualizarInicio();

mostrarClientes();

mostrarPiscinas();

mostrarJardins();

mostrarFinanceiro();

mostrarAgenda();

}


atualizarTudo();

</script>

</body>
</html>
